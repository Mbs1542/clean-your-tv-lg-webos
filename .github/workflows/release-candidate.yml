name: Maintain next release candidate
on:
  push:
    branches: [release/next]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: next-release-candidate
  cancel-in-progress: false
jobs:
  candidate:
    if: github.ref == 'refs/heads/release/next'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Open a draft unless the current candidate already exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release-flow.py ensure-candidate
      - name: Refresh generated scope, versions and selected build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh pr list --base main --head release/next --json number --jq 'length' | python -c "import sys; sys.exit(0 if int(sys.stdin.read()) == 1 else 1)"; then
            python scripts/release-flow.py sync-record
          fi
