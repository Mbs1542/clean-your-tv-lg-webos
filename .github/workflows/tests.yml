name: Tests
on:
  pull_request:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: tests-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ inputs.source_sha }}
  cancel-in-progress: ${{ inputs.source_sha == '' }}
jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      any: ${{ steps.scope.outputs.any }}
      runtime: ${{ steps.scope.outputs.runtime }}
      tv: ${{ steps.scope.outputs.tv }}
      installer: ${{ steps.scope.outputs.installer }}
      android: ${{ steps.scope.outputs.android }}
      setup: ${{ steps.scope.outputs.setup }}
      preview: ${{ steps.scope.outputs.preview }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: scope
        env:
          CI_FULL_SUITE: ${{ inputs.source_sha != '' }}
        run: python scripts/ci-scope.py
  tests:
    needs: scope
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Documentation-only change
        if: needs.scope.outputs.any != 'true'
        run: echo 'No application checks needed.'
      - uses: actions/checkout@v4
        if: needs.scope.outputs.any == 'true'
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        if: needs.scope.outputs.any == 'true'
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        if: needs.scope.outputs.any == 'true'
        with:
          python-version: "3.12"
      - run: npm ci --ignore-scripts --no-audit --no-fund
        if: needs.scope.outputs.any == 'true'
      - run: python -m pip install -r cytv/requirements.txt
        if: needs.scope.outputs.any == 'true'
      - name: Identify merged test inputs and installed runtime
        id: fingerprint
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && inputs.source_sha == '' && needs.scope.outputs.runtime == 'true'
        env:
          TEST_SELECTION: ${{ needs.scope.outputs.tv }},${{ needs.scope.outputs.installer }},${{ needs.scope.outputs.android }},${{ needs.scope.outputs.preview }}
        run: python scripts/release-inputs.py --test-key
      - uses: actions/cache/restore@v4
        continue-on-error: true
        id: cached
        if: steps.fingerprint.outputs.key != '' && github.run_attempt == 1
        with:
          path: ${{ runner.temp }}/cytv-test-success
          key: cytv-tests-${{ github.event.pull_request.number }}-${{ matrix.os }}-${{ steps.fingerprint.outputs.key }}
      - name: Verify cached success is still the latest passing evidence
        id: reuse
        if: steps.cached.outputs.cache-hit == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release-inputs.py --check-test-cache "$RUNNER_TEMP/cytv-test-success"
      - name: Validate current release metadata independently of runtime reuse
        if: needs.scope.outputs.any == 'true'
        run: |
          python -m unittest discover -s tests/setup -p test_readme_release.py
          python - <<'PYTHON'
          import json, runpy
          from pathlib import Path
          runpy.run_path('scripts/release-flow.py')['validate_shape'](json.loads(Path('release-plan.json').read_text()))
          PYTHON
      - name: Check affected setup and packaging
        if: needs.scope.outputs.setup == 'true'
        run: scripts/test.sh setup
      - name: Prepare pinned Node 0.12.2 for Helper regression
        if: steps.reuse.outputs.hit != 'true' && runner.os == 'Linux' && (needs.scope.outputs.tv == 'true' || needs.scope.outputs.installer == 'true')
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location https://nodejs.org/dist/v0.12.2/node-v0.12.2-linux-x64.tar.gz --output node-v0.12.2-linux-x64.tar.gz
          echo '4e1578efc2a2cc67651413a05ccc4c5d43f6b4329c599901c556f24d93cd0508  node-v0.12.2-linux-x64.tar.gz' | sha256sum --check -
          tar -xzf node-v0.12.2-linux-x64.tar.gz
          echo "NODE012=$RUNNER_TEMP/node-v0.12.2-linux-x64/bin/node" >> "$GITHUB_ENV"
      - name: Test affected runtime components
        if: needs.scope.outputs.runtime == 'true' && steps.reuse.outputs.hit != 'true'
        env:
          TV: ${{ needs.scope.outputs.tv }}
          INSTALLER: ${{ needs.scope.outputs.installer }}
          ANDROID: ${{ needs.scope.outputs.android }}
          PREVIEW: ${{ needs.scope.outputs.preview }}
        shell: bash
        run: |
          components=()
          [ "$TV" != true ] || components+=(tv)
          [ "$INSTALLER" != true ] || components+=(installer)
          [ "$ANDROID" != true ] || components+=(android)
          [ "$PREVIEW" != true ] || components+=(preview)
          scripts/test.sh "${components[@]}"
      - name: Check compiled Home with legacy browser limitations
        if: steps.reuse.outputs.hit != 'true' && runner.os == 'Linux' && needs.scope.outputs.tv == 'true'
        run: |
          npx playwright install --with-deps chromium
          python scripts/tv_web_build.py --input launcher --output build/legacy-ui
          BROWSER_CHANNEL=chromium TV_WEB_DIR=build/legacy-ui npm run test:legacy-ui
          BROWSER_CHANNEL=chromium TV_WEB_DIR=build/legacy-ui npm run test:geometry
      - name: Verify real webOS-style file ownership
        if: steps.reuse.outputs.hit != 'true' && runner.os == 'Linux' && needs.scope.outputs.tv == 'true'
        run: sudo "$(command -v node)" native/prototype/test-state-permissions-linux.cjs
      - name: Record reusable success after every selected check passes
        if: steps.fingerprint.outputs.key != '' && steps.reuse.outputs.hit != 'true'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/cytv-test-success"
          printf '%s\n' "$GITHUB_RUN_ID" > "$RUNNER_TEMP/cytv-test-success/run"
      - uses: actions/cache/save@v4
        continue-on-error: true
        if: steps.fingerprint.outputs.key != '' && steps.reuse.outputs.hit != 'true'
        with:
          path: ${{ runner.temp }}/cytv-test-success
          key: cytv-tests-${{ github.event.pull_request.number }}-${{ matrix.os }}-${{ steps.fingerprint.outputs.key }}
  optional-python:
    needs: scope
    if: needs.scope.outputs.installer == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: build/python-runtime-cache
          key: root-python-4a71641c8d5536175e404a961624e8656eba30e97b5026f6bd7dc31e4bbeaaea
      - name: Install ARM user emulation and EABI sysroot
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-user libc6-armel-cross libgcc-s1-armel-cross
      - name: Execute the pinned ARM32 Python and native module smoke tests
        run: python scripts/test-python-runtime.py
      - name: Verify shell provisioning boundaries as root
        run: sudo "$(command -v python)" -m unittest tests.cytv.test_python_runtime
